# ------------------------------------------------------------
# Trader Tool – Konfiguration
# Änderungen hier werden beim nächsten Lauf automatisch übernommen.
# ------------------------------------------------------------

# Adresse deiner Website (nach Einrichtung von GitHub Pages eintragen,
# z. B. https://DEIN-NAME.github.io/trader-tool/). Wird in der E-Mail verlinkt.
site_url: "https://olegspitsov1990-create.github.io/trader-tool/"

groups:
  crypto:
    market: crypto
    source: binance            # gleiche Kerzen wie BINANCE:BTCUSDT in TradingView
    symbols: [BTCUSDT, ETHUSDT]
    names:
      BTCUSDT: Bitcoin
      ETHUSDT: Ethereum
    timeframes: [1h, 4h, 1d]

  stocks:
    market: stocks
    universe: sp500          # Liste wird automatisch von Wikipedia geladen
    timeframes: [1d]

analysis:
  breakout_lookback: 20      # Hoch/Tief der letzten N Kerzen für Ausbruch
  volume_factor: 1.5         # Mindest-Volumen relativ zum 20er-Durchschnitt
  squeeze_min_bars: 5        # Kerzen im Bollinger-Squeeze, bevor gewarnt wird
  horizon_bars: 10           # Zeitfenster für "Ausbruch" (in Kerzen)
  barrier_atr: 1.5           # Ausbruch = Kurs bewegt sich ±1,5 ATR
  stock_close_buffer_minutes: 2   # Aktien-Tageskerze N Minuten nach US-Börsenschluss auswerten

alerts:
  min_probability: 0.55      # Mindest-Richtungswahrscheinlichkeit für einen Alarm
  min_edge: 0.05             # Mindest-Vorteil gegenüber der Basisrate (0.05 = 5 Prozentpunkte)
  min_samples: 30            # Mindestanzahl historischer Fälle des Setups
  cooldown_bars: 5           # gleiches Setup beim gleichen Symbol frühestens nach N Kerzen erneut
  max_signals_per_mail: 25   # weitere Signale stehen auf der Website

# Live-Modus auf dem eigenen PC (live.py / "Trader-Tool starten.bat")
live:
  port: 8080                 # lokale Website: http://localhost:8080
  stocks_poll_seconds: 60    # Aktien-Livekurse (Alpaca) alle N Sekunden
