name: Trader Tool – Überwachung

on:
  schedule:
    - cron: "7 * * * *"        # Krypto: stündlich (1h/4h/1D-Kerzen)
    - cron: "35 21 * * 1-5"    # Aktien: werktags nach US-Börsenschluss (22:35 MEZ / 23:35 MESZ)
  workflow_dispatch:
    inputs:
      group:
        description: "Gruppe"
        type: choice
        options: [crypto, stocks]
        default: crypto
      dry_run:
        description: "Testlauf ohne E-Mail"
        type: boolean
        default: false
      test_mail:
        description: "Nur Test-E-Mail senden (keine Analyse)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trader-tool
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Gruppe bestimmen
        id: g
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "group=${{ inputs.group }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "35 21 * * 1-5" ]; then
            echo "group=stocks" >> "$GITHUB_OUTPUT"
          else
            echo "group=crypto" >> "$GITHUB_OUTPUT"
          fi

      - name: Analyse ausführen
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ "${{ inputs.test_mail }}" = "true" ]; then
            python run.py --group crypto --test-mail
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            python run.py --group ${{ steps.g.outputs.group }} --dry-run
          else
            python run.py --group ${{ steps.g.outputs.group }}
          fi

      - name: Ergebnisse speichern
        run: |
          git config user.name "trader-tool-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data state config
          if ! git diff --cached --quiet; then
            git commit -m "Update ${{ steps.g.outputs.group }} $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  deploy:
    needs: monitor
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
