name: Trader Tool – Überwachung

# Die laufende Überwachung macht jetzt der Live-Modus auf dem PC (live.py).
# Dieser Workflow dient nur noch für manuelle Läufe und die Test-E-Mail.
# Zum Reaktivieren des Zeitplans die folgenden Zeilen wieder einkommentieren:
#  schedule:
#    - cron: "7 * * * *"
#    - cron: "35 21 * * 1-5"
on:
  workflow_dispatch:
    inputs:
      group:
        description: "Gruppe"
        type: choice
        options: [crypto, stocks]
        default: crypto
      dry_run:
        description: "Testlauf ohne E-Mail"
        type: boolean
        default: false
      test_mail:
        description: "Nur Test-E-Mail senden (keine Analyse)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trader-tool
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Gespeicherte Daten laden (Zweig "data")
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch -q --depth 1 origin data
            rm -rf docs/data state
            git archive FETCH_HEAD | tar -x
          fi
          mkdir -p docs/data state

      - name: Gruppe bestimmen
        id: g
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "group=${{ inputs.group }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "35 21 * * 1-5" ]; then
            echo "group=stocks" >> "$GITHUB_OUTPUT"
          else
            echo "group=crypto" >> "$GITHUB_OUTPUT"
          fi

      - name: Analyse ausführen
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ "${{ inputs.test_mail }}" = "true" ]; then
            python run.py --group crypto --test-mail
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            python run.py --group ${{ steps.g.outputs.group }} --dry-run
          else
            python run.py --group ${{ steps.g.outputs.group }}
          fi

      - name: Daten speichern (Zweig "data" wird überschrieben, kein Anwachsen des Repos)
        env:
          TOKEN: ${{ github.token }}
        run: |
          tmp=$(mktemp -d)
          mkdir -p "$tmp/docs"
          cp -r docs/data "$tmp/docs/"
          cp -r state "$tmp/"
          cd "$tmp"
          git init -q -b data
          git add -A
          git -c user.name="trader-tool-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Daten ${{ steps.g.outputs.group }} $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -fq "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" data

      - name: Zeitplan aktiv halten (GitHub pausiert ihn nach 60 Tagen ohne Commit)
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 4320000 ]; then
            git -c user.name="trader-tool-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --allow-empty -qm "keepalive"
            git push -q origin HEAD:main
          fi

  deploy:
    needs: monitor
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Daten einbinden
        run: |
          git fetch -q --depth 1 origin data
          git archive FETCH_HEAD docs/data | tar -x
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
